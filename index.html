<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E3B3A">
<meta name="description" content="IPilot KG — налоговый помощник для ИП в Кыргызстане">
<style id="base-reset">:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>IPilot KG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Мобильное приложение: одна колонка до 480px, шапка сверху, вкладки снизу.
   Палитра — как в презентации: тёмная бирюза, бумажный фон, янтарный акцент. */
:root {
  --bg: #F3EFE4;
  --surface: #FFFDF8;
  --surface-2: #F8F4EA;
  --ink: #12302F;
  --ink-2: #4B5A59;
  --ink-3: #6E7C7A;
  --line: #E2DCCD;
  --brand: #0E3B3A;
  --brand-ink: #F6F3EC;
  --brand-ink-2: #BFD3CF;
  --accent: #E9A23B;
  --accent-ink: #0E3B3A;
  --accent-soft: #FBEBD0;
  --chip: #E4EDE9;
  --good: #2E7356;
  --good-soft: #DDEFE6;
  --warn: #9A5B10;
  --warn-soft: #FBEBD0;
  --bad: #A8402F;
  --bad-soft: #F7DED8;
  --focus: #1F7A74;
  --shadow: 0 1px 2px rgba(14, 59, 58, .06), 0 8px 24px rgba(14, 59, 58, .06);
  --f-display: 'Rubik', 'Trebuchet MS', Arial, sans-serif;
  --f-body: 'Nunito Sans', 'Segoe UI', Arial, sans-serif;
  --f-mono: 'JetBrains Mono', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1A1A; --surface: #112827; --surface-2: #0E2221; --ink: #EAF0EB; --ink-2: #AFC4BF; --ink-3: #8BA29D;
    --line: #23403D; --brand: #164744; --brand-ink: #F3F0E6; --brand-ink-2: #BFD3CF; --accent: #F0B24E; --accent-ink: #0B1E1E;
    --accent-soft: #3A2C14; --chip: #1B3A37; --good: #7FD0A8; --good-soft: #163A2C; --warn: #F0B24E; --warn-soft: #3A2C14;
    --bad: #F29A87; --bad-soft: #43221C; --focus: #7FD0C8; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1A1A; --surface: #112827; --surface-2: #0E2221; --ink: #EAF0EB; --ink-2: #AFC4BF; --ink-3: #8BA29D;
  --line: #23403D; --brand: #164744; --brand-ink: #F3F0E6; --brand-ink-2: #BFD3CF; --accent: #F0B24E; --accent-ink: #0B1E1E;
  --accent-soft: #3A2C14; --chip: #1B3A37; --good: #7FD0A8; --good-soft: #163A2C; --warn: #F0B24E; --warn-soft: #3A2C14;
  --bad: #F29A87; --bad-soft: #43221C; --focus: #7FD0C8; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
a { color: var(--ink); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* Шапка */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid transparent;
}
.top.scrolled { border-bottom-color: var(--line); }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--ink); text-decoration: none; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; }
.logo-mark svg { width: 18px; height: 18px; }
.logo small { font-weight: 500; color: var(--ink-3); font-size: 14px; }
.top-spacer { flex: 1; }
.lang { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: transparent; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.lang button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }

/* Контент */
main {
  flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px;
}
.view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.h-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-title { font-size: 18px; font-weight: 600; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); }
.muted { color: var(--ink-2); }
.tiny { font-size: 13px; color: var(--ink-3); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
.banner svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }
.banner.info { background: var(--chip); }
.banner.warn { background: var(--warn-soft); color: var(--ink); }
.banner.bad { background: var(--bad-soft); }
.banner.good { background: var(--good-soft); }
.banner .grow { flex: 1; min-width: 0; }
.banner button.link { border: 0; background: none; padding: 0; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

/* Главная карточка налога */
.hero { background: var(--brand); color: var(--brand-ink); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.hero .label { color: var(--brand-ink-2); font-size: 14px; font-weight: 700; }
.hero .amount { font-family: var(--f-display); font-weight: 700; font-size: clamp(40px, 12vw, 54px); line-height: 1; letter-spacing: -.02em; }
.hero .sub { color: var(--brand-ink-2); font-size: 15px; }
.hero .formula { font-family: var(--f-mono); font-size: 13px; color: var(--brand-ink-2); overflow-wrap: anywhere; }
.deadline { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.08); border-radius: 16px; padding: 12px; }
.deadline .days { min-width: 64px; text-align: center; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 6px 8px; font-family: var(--f-display); font-weight: 700; line-height: 1.05; }
.deadline .days b { display: block; font-size: 24px; }
.deadline .days span { font-size: 11px; font-weight: 600; }
.deadline .what { font-size: 14px; line-height: 1.35; }
.deadline .what b { display: block; font-size: 15px; }
.hero .cells { display: flex; gap: 6px; flex-wrap: wrap; }
.cell-chip { font-family: var(--f-mono); font-size: 12px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--warn); border: 1px solid transparent; }
.hero .cell-chip { background: rgba(255,255,255,.12); color: var(--brand-ink); }

/* Кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: 15px; text-decoration: none; color: var(--ink); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.hero .btn { border-color: transparent; }

/* Чипы профиля */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--chip); color: var(--ink); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

/* Список сроков */
.dl-list { display: flex; flex-direction: column; }
.dl-item { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.dl-item:first-child { border-top: 0; padding-top: 0; }
.dl-date { text-align: center; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); padding: 6px 0; font-family: var(--f-display); line-height: 1.05; }
.dl-date b { display: block; font-size: 20px; }
.dl-date span { font-size: 11px; color: var(--ink-2); text-transform: uppercase; font-weight: 600; }
.dl-item.off .dl-date, .dl-item.off .dl-text { opacity: .55; }
.dl-text { min-width: 0; }
.dl-text b { display: block; font-size: 15px; line-height: 1.3; }
.dl-text span { font-size: 13px; color: var(--ink-2); }
.dl-actions { display: flex; gap: 6px; }
.dl-actions a, .dl-actions button { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.dl-actions svg { width: 18px; height: 18px; }

/* Формы и поля */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.input { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.input.big { font-family: var(--f-display); font-weight: 600; font-size: 26px; }
textarea.input { min-height: 56px; resize: vertical; line-height: 1.4; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; min-height: 40px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg-sm button { font-size: 13px; line-height: 1.2; padding: 4px 6px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 360px) { .grid-2 { grid-template-columns: 1fr; } }

/* Выручка */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 10px; min-width: 0; }
.stat span { display: block; font-size: 12px; color: var(--ink-2); font-weight: 700; }
.stat b { font-family: var(--f-display); font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.chart { width: 100%; height: auto; display: block; }
.rev-day { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.rev-day:first-child { border-top: 0; }
.rev-row { display: flex; align-items: center; gap: 10px; }
.rev-row .when { flex: 1; font-weight: 700; }
.rev-row .sum { font-family: var(--f-display); font-weight: 600; }
.rev-row button { border: 0; background: none; color: var(--ink-3); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; }
.rev-row button svg { width: 16px; height: 16px; }
.rev-split { font-size: 13px; color: var(--ink-2); }
.parse-preview { display: flex; flex-direction: column; gap: 10px; background: var(--accent-soft); border-radius: 14px; padding: 12px; }

/* Черновик отчёта */
.form-sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.form-head { background: var(--surface-2); padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--line); }
.form-head b { font-family: var(--f-mono); font-size: 13px; }
.form-head span { font-size: 12px; color: var(--ink-3); text-align: right; }
.form-sec { padding: 4px 14px 10px; }
.form-sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; padding: 10px 0 4px; font-family: var(--f-body); }
.frow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px dashed var(--line); }
.frow .lbl { overflow-wrap: anywhere; hyphens: auto; }
.frow .code { font-family: var(--f-mono); font-weight: 700; font-size: 13px; text-align: center; border-radius: 7px; padding: 4px 0; background: var(--surface-2); color: var(--ink-2); }
.frow .lbl { font-size: 14px; line-height: 1.3; min-width: 0; }
.frow .val { font-family: var(--f-display); font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.frow.fill .code { background: var(--accent); color: var(--accent-ink); }
.frow.fill { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); margin: 0 -14px; padding-inline: 14px; border-top-style: solid; }
.frow.auto .val { color: var(--ink-3); font-family: var(--f-body); font-weight: 600; font-size: 13px; }
.frow.total .lbl { font-weight: 800; }
.copy { border: 1px solid var(--line); background: var(--surface); width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
.copy svg { width: 15px; height: 15px; }
.copy.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
.rest-toggle { border: 0; background: none; width: 100%; text-align: left; padding: 12px 14px; font-size: 14px; color: var(--ink-2); font-weight: 700; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
.rest-list { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-3); }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 15px; line-height: 1.4; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.ai-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.check-row { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check-row input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--brand); flex: none; }
.src-list { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.src-list a { color: var(--ink-2); text-underline-offset: 3px; }

/* Чат */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 6px; }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.ai.thinking { color: var(--ink-3); font-style: italic; }
.msg .msg-src { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; white-space: normal; }
.msg .msg-src a { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: var(--chip); text-decoration: none; color: var(--ink); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 600; text-align: left; }
.composer { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; background: var(--bg); padding-block: 8px; }
.composer textarea { flex: 1; min-height: 48px; max-height: 140px; }
.composer .btn { min-width: 52px; padding: 0 14px; }

/* Нижнее меню */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: none; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--warn); }

/* Онбординг */
.onb { display: flex; flex-direction: column; gap: 18px; padding-top: 8px; }
.onb-progress { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.onb-progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.onb h1 { font-size: 28px; line-height: 1.15; }
.choice-list { display: flex; flex-direction: column; gap: 10px; }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.choice b { font-size: 16px; }
.choice span { font-size: 14px; color: var(--ink-2); }
.choice[aria-pressed="true"] { border-color: var(--brand); background: var(--chip); }
.toggle-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.toggle-row:first-child { border-top: 0; }
.toggle-row .t { flex: 1; font-size: 15px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.switch input:checked + i { background: var(--brand); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }
.checklist { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.checklist div { display: flex; gap: 8px; align-items: flex-start; }
.checklist svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.checklist .ok svg { color: var(--good); }
.checklist .no svg { color: var(--bad); }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; z-index: 40; max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <a class="logo" href="#home" id="logo" aria-label="IPilot KG">
      <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18 L12 4 L20 18 L12 14 Z" fill="#E9A23B"/></svg></span>
      IPilot <small>KG</small>
    </a>
    <div class="top-spacer"></div>
    <div class="lang" role="group" aria-label="Язык / Тил">
      <button type="button" id="lang-ru" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" id="lang-ky" data-lang="ky" aria-pressed="false">KG</button>
    </div>
    <button type="button" class="icon-btn" id="btn-profile" aria-label="Профиль">
